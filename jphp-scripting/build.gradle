
sourceSets {
    test.resources.srcDirs = ["src/main/tests"]
}

dependencies {
    api project(':jphp-core')
    api project(':exts:jphp-zend-ext')

    testImplementation 'junit:junit:4.+'
    testImplementation project.project(':jphp-core').sourceSets.test.output
}

test {
    // QA-only census of owned JVM shutdown hooks; production launchers need no opens.
    jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED'
}
