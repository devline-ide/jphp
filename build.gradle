def javaVersion = JavaVersion.VERSION_25
def projectVersion = '0.9.3'
def sourceRepository = file(System.getProperty('maven.repo.local', "$rootDir/../../.gradle/source-repo"))

allprojects {
    apply plugin: 'idea'
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'

    group = 'org.develnext.jphp'
    version = projectVersion + (Boolean.getBoolean('release') ? '' : '-SNAPSHOT')

    repositories {
        mavenCentral()
    }

    dependencies {
        compileOnly('org.openjfx:javafx-base:25.0.4:win') { transitive = false }
        compileOnly('org.openjfx:javafx-graphics:25.0.4:win') { transitive = false }
        compileOnly('org.openjfx:javafx-controls:25.0.4:win') { transitive = false }
        compileOnly('org.openjfx:javafx-fxml:25.0.4:win') { transitive = false }
        compileOnly('org.openjfx:javafx-media:25.0.4:win') { transitive = false }
        compileOnly('org.openjfx:javafx-swing:25.0.4:win') { transitive = false }
        compileOnly('org.openjfx:javafx-web:25.0.4:win') { transitive = false }
    }

    java {
        sourceCompatibility = javaVersion
        targetCompatibility = javaVersion
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.withType(Test).configureEach {
        inputs.property('jphpTestCompiled', System.getenv('JPHP_TEST_COMPILED') != null)
        inputs.property('jphpTestConcurrent', System.getenv('JPHP_TEST_CONCURRENT') != null)
    }

    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
    }
}

subprojects {
    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java
            }
        }
        repositories {
            maven {
                name = 'sourceRepository'
                url = sourceRepository.toURI()
            }
        }
    }
}

wrapper {
    gradleVersion = '9.7.1'
}

tasks.register('publishSource') {
    dependsOn subprojects.collect {
        it.tasks.named('publishAllPublicationsToSourceRepositoryRepository')
    }
}
