apply plugin: 'application'

application {
    mainClass = 'php.runtime.launcher.Launcher'
}

sourceSets {
    main.resources.srcDirs = ['src']
}

dependencies {
    api project(':jphp-core')
    api project(':exts:jphp-zend-ext')
    api project(':exts:jphp-yaml-ext')
    api project(':exts:jphp-xml-ext')
    api project(':exts:jphp-graphic-ext')
    //compile project(':jphp-json-ext')
    //compile project(':jphp-jsoup-ext')
    //compile project(':jphp-gdx-ext')
    //compile project(':jphp-mail-ext')
    //compile project(':jphp-sql-ext')
    //compile project(':jphp-orientdb-ext')
    //compile project(':jphp-webserver-ext')

    api project(':jphp-debugger')

    api 'org.xerial:sqlite-jdbc:3.8.7'
}

run {
    jvmArgs = ["-Dfile.encoding=UTF-8", "-Djphp.trace=false"]
}

